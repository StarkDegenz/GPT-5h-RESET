name: Telegram quota alerts
on:
  workflow_run:
    workflows: ['Codex quota test (disabled by default)']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: telegram-quota-alerts
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/quota-test.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # Load trusted default-branch code, never the triggering run's artifacts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Send state-change alerts only
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_notify.py
